[package]
name = "vanilla-server"
version = "0.1.0"
edition = "2021"
description = "Bounded Minecraft Java 1.7.10 vanilla-only Rust server prototype"

[dependencies]
legacy-protocol = { path = "../../crates/legacy-protocol" }
fastnbt = "=2.6.3"
serde = { version = "1", features = ["derive"] }
flate2 = "1"
md5 = "0.7"
fs2 = "0.4.3"
serde_json = "1"

fastanvil = { version = "=0.32.0", default-features = false }

# Protocol 5 online-mode: RSA challenge, continuous AES-CFB8, signed SHA1, HTTPS session verification.
rsa = "0.9"
rand = "0.8"
aes = "0.8"
sha1 = "0.10"
ureq = "2.12"
