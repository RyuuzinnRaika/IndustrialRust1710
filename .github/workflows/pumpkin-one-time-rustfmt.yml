name: Pumpkin NBT integration rustfmt (temporary)
on:
  push:
    branches: [feat/pumpkin-nbt-gpl3-integration]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pumpkin-nbt-gpl3-integration
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server crates/pumpkin-nbt
            git commit -m 'style: apply rustfmt to imported Pumpkin NBT integration'
            git push origin HEAD:feat/pumpkin-nbt-gpl3-integration
          fi
