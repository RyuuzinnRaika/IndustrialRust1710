name: Group B one-time Rust formatter
on:
  push:
    branches:
      - feat/b11-20-block-physics-20261021
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/b11-20-block-physics-20261021
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        run: |
          cargo fmt --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style(world): rustfmt Group B regression tests"
            git push origin HEAD:feat/b11-20-block-physics-20261021
          fi
