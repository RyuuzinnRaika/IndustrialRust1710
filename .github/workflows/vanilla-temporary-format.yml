name: Temporary formatting for native vanilla branch
on:
  push:
    branches: [feat/vanilla-protocol5-foundation]
permissions:
  contents: write
jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vanilla-protocol5-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt and commit changes
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server
            git commit -m 'style(vanilla): apply canonical cargo fmt'
            git push origin HEAD:feat/vanilla-protocol5-foundation
          fi
