name: Windows Minecraft GUI smoke test
on:
  pull_request:
    paths:
      - "tools/ServerGui.cs"
      - "run-windows.ps1"
      - "run-windows-gui.ps1"
      - ".github/workflows/windows-gui.yml"
  push:
    branches: [main]
    paths:
      - "tools/ServerGui.cs"
      - "run-windows.ps1"
      - "run-windows-gui.ps1"
      - ".github/workflows/windows-gui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-windows-gui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and compile WinForms source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('run-windows.ps1', 'run-windows-gui.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "Invalid syntax in $path : $($errors | Out-String)"
            }
          }
          # The GUI runs in a PowerShell host that may already own an HWND.
          # A late process-wide text rendering setter crashes at startup.
          $guiSource = Get-Content -LiteralPath 'tools/ServerGui.cs' -Raw
          if ($guiSource -match '(?m)^\s*Application\.SetCompatibleTextRenderingDefault\s*\(') {
            throw 'WinForms text rendering default must not be set from hosted GUI startup.'
          }
          Add-Type -Path (Resolve-Path 'tools/ServerGui.cs').Path -ReferencedAssemblies @('System.Windows.Forms', 'System.Drawing') -ErrorAction Stop
          $gui = [IndustrialRust1710.ServerGui]
          $flags = [System.Reflection.BindingFlags]'Static,NonPublic'
          $quote = $gui.GetMethod('QuoteArgument', $flags)
          if (-not $quote) { throw 'Missing QuoteArgument method' }
          $actual = [string]$quote.Invoke($null, @('two words'))
          if ($actual -ne '"two words"') { throw "Unexpected argument encoding: $actual" }
          $normalize = $gui.GetMethod('NormalizeCommand', $flags)
          if (-not $normalize) { throw 'Missing NormalizeCommand method' }
          foreach ($case in @(
            @{ Input = ' list '; Expected = '/list' },
            @{ Input = '/save'; Expected = '/save' },
            @{ Input = ' stop '; Expected = '/stop' },
            @{ Input = '   '; Expected = '' }
          )) {
            $actual = [string]$normalize.Invoke($null, @([string]$case.Input))
            if ($actual -ne $case.Expected) { throw "Console command normalization failed: $($case.Input)" }
          }
          Write-Host 'PowerShell syntax, WinForms compilation, and console command smoke tests passed.'
