name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Official 1.7.10 vanilla launcher tests (no game download)
        run: python3 -m unittest discover -s tests -p 'test_vanilla1710_launcher.py' -v
      - name: Official Mojang 1.7.10 server artifact and secure setup
        shell: bash
        run: |
          python3 tools/vanilla1710.py prepare --dir "$RUNNER_TEMP/official-vanilla-1710"
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'official-vanilla-1710'
          jar=root/'minecraft_server.1.7.10.jar'
          xml=root/'log4j2_17-111.xml'
          assert jar.stat().st_size==9605030
          assert hashlib.sha1(jar.read_bytes()).hexdigest()=='952438ac4e01b4d115c5fc38f891710c4941df29'
          assert hashlib.sha1(xml.read_bytes()).hexdigest()=='dd2b723346a8dcd48e7f4d245f6bf09e98db9696'
          prop=(root/'server.properties').read_text()
          assert 'online-mode=true' in prop and 'white-list=true' in prop
          assert 'server-ip=127.0.0.1' in prop
          assert (root/'whitelist.json').read_text().strip()=='[]'
          assert 'eula=false' in (root/'eula.txt').read_text()
          print('Official Mojang vanilla 1.7.10 jar and Log4j mitigation verified; EULA intentionally not accepted.')
          PY
          if python3 tools/vanilla1710.py check --dir "$RUNNER_TEMP/official-vanilla-1710"; then
            echo "ERROR: did not refuse startup without EULA consent"
            exit 1
          fi
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Unit tests
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Status/Ping integration smoke test
        shell: bash
        run: |
          cargo build -p legacy-status-server
          ./target/debug/legacy-status-server --bind 127.0.0.1:25567 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for _ in range(40):
              try:
                  socket.create_connection(('127.0.0.1', 25567), timeout=0.2).close()
                  break
              except OSError:time.sleep(0.1)
          else:raise SystemExit('no listening socket')
          PY
          python3 tests/protocol5_smoke.py 127.0.0.1 25567
      - name: Vanilla 1.7.10 Login/Play/chunk/edit smoke test
        shell: bash
        run: |
          cargo build -p vanilla-server
          printf '[{"name":"RustTester"},{"name":"Positioner"},{"name":"TwinAlpha"},{"name":"TwinBeta"},{"name":"ChunkScout"}]\n' > "$RUNNER_TEMP/whitelist.json"
          ./target/debug/vanilla-server --bind 127.0.0.1:25568 --world "$RUNNER_TEMP/industrial-smoke.irw" --whitelist "$RUNNER_TEMP/whitelist.json" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket,time
          for _ in range(40):
              try:
                  socket.create_connection(('127.0.0.1', 25568), timeout=0.2).close()
                  break
              except OSError: time.sleep(0.1)
          else: raise SystemExit('vanilla server not listening')
          PY
          python3 tests/whitelist_smoke.py 127.0.0.1 25568 "$RUNNER_TEMP/whitelist.json"
          python3 tests/vanilla_smoke.py 127.0.0.1 25568 "$RUNNER_TEMP/industrial-smoke.irw"
          python3 tests/player_position_smoke.py 127.0.0.1 25568 "$RUNNER_TEMP/players/positioner.dat"
          python3 tests/multiplayer_smoke.py 127.0.0.1 25568
          python3 tests/chunk_streaming_smoke.py 127.0.0.1 25568
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          ./target/debug/vanilla-server --world "$RUNNER_TEMP/industrial-smoke.irw" --export-anvil "$RUNNER_TEMP/industrial-anvil-snapshot"
          python3 tests/anvil_export_smoke.py "$RUNNER_TEMP/industrial-anvil-snapshot"
          ./target/debug/vanilla-server --import-anvil "$RUNNER_TEMP/industrial-anvil-snapshot" --world "$RUNNER_TEMP/roundtrip.irw"
          cmp "$RUNNER_TEMP/industrial-smoke.irw" "$RUNNER_TEMP/roundtrip.irw"
          if ./target/debug/vanilla-server --import-anvil "$RUNNER_TEMP/industrial-anvil-snapshot" --world "$RUNNER_TEMP/roundtrip.irw"; then
            echo 'ERROR: importer overwrote an existing IRW1 world'
            exit 1
          fi
          cmp "$RUNNER_TEMP/industrial-smoke.irw" "$RUNNER_TEMP/roundtrip.irw"
