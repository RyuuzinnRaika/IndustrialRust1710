name: Rust-only Minecraft 1.7.10 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Temporary rustfmt export for B13-B22 PR
        run: |
          cargo fmt --all
          for f in apps/vanilla-server/src/*.rs; do
            if ! git diff --quiet -- "$f"; then
              echo "BEGIN_FORMAT:$f"
              base64 -w0 "$f"
              echo
              echo "END_FORMAT:$f"
            fi
          done
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Native Minecraft Protocol 5 tests (real TCP and Anvil roundtrip)
        run: cargo test --workspace --all-targets
      - name: Deny Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build optimized Rust server binaries
        run: cargo build --release -p vanilla-server -p legacy-status-server
