name: Rust-only Minecraft 1.7.10 CI
# Rust CI is not run automatically. Enable only after explicit user authorization.
# Local/offline Rust validation is documented separately.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Native Minecraft Protocol 5 tests (real TCP and Anvil roundtrip)
        run: cargo test --workspace --all-targets
      - name: Deny Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build optimized Rust server binaries
        run: cargo build --release -p vanilla-server -p legacy-status-server
