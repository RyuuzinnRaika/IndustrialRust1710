name: Rust-only Minecraft 1.7.10 CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Native Minecraft Protocol 5 tests (real TCP and Anvil roundtrip)
        run: cargo test --locked --workspace --all-targets
      - name: Deny Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build optimized Rust server binaries
        run: cargo build --locked --release -p vanilla-server -p legacy-status-server
      - name: Validate Python maintenance supervisor
        run: python3 -m unittest discover -s tools -p 'test_*.py'
