name: Vanilla branch rustfmt (temporary)
on:
  push:
    branches: [feat/whitelist-and-vanilla-tick-foundation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/whitelist-and-vanilla-tick-foundation
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply and commit formatting
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server
            git commit -m 'style(vanilla): apply rustfmt to whitelist and tick'
            git push origin HEAD:feat/whitelist-and-vanilla-tick-foundation
          fi
