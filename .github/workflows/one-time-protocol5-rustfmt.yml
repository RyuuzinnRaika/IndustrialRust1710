name: Vanilla 1.7.10 TCP rustfmt (temporary)
on:
  push:
    branches: [fix/vanilla1710-fragmented-tcp-and-backup]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vanilla1710-fragmented-tcp-and-backup
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format modified Rust
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/legacy-protocol apps/vanilla-server
            git commit -m 'style: format resumable Protocol5 TCP parser'
            git push origin HEAD:fix/vanilla1710-fragmented-tcp-and-backup
          fi
