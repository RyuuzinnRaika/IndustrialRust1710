name: Permissive NBT one-time formatting
on:
  push:
    branches: [fix/remove-pumpkin-gpl-source]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-pumpkin-gpl-source
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server/src/player.rs
            git commit -m 'style: format permissively licensed NBT integration'
            git push origin HEAD:fix/remove-pumpkin-gpl-source
          fi
