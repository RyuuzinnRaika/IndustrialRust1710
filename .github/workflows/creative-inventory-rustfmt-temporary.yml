name: Format Creative inventory (temporary)
on:
  push:
    branches: [feat/vanilla17-creative-inventory]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vanilla17-creative-inventory
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format updated Rust and commit
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server
            git commit -m 'style: format Protocol 5 Creative inventory Rust implementation'
            git push origin HEAD:feat/vanilla17-creative-inventory
          fi
