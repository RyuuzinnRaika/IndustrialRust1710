name: One-shot Rust formatting (feature branch)
on:
  push:
    branches:
      - feat/world-simulation-a01-a12-20261021
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust and remove this temporary workflow
        run: |
          cargo fmt --all
          rm .github/workflows/format-world-20261021.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: format additional world and harvest logic"
            git push origin HEAD:feat/world-simulation-a01-a12-20261021
          fi
