name: Ground-items Rust formatting (temporary)
on:
  push:
    branches: [feat/survival-ground-item-entities]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/survival-ground-item-entities
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add apps/vanilla-server
            git commit -m 'style(survival): format ground item packets and pickup logic'
            git push origin HEAD:feat/survival-ground-item-entities
          fi
