name: Rust-only source formatting (temporary)
on:
  push:
    branches: [refactor/rust-only-1710]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/rust-only-1710
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit Rust integration tests
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add apps/vanilla-server apps/legacy-status-server
            git commit -m 'style: format Rust-only integration checks'
            git push origin HEAD:refactor/rust-only-1710
          fi
